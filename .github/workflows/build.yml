name: Build strike grid
on:
  schedule:
    # ~35 minutes after each Sea Intelligence map run (12:15 AM, 6:15 AM, 12:15 PM, 6:15 PM Jamaica)
    - cron: '50 5,11,17,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy pillow matplotlib
      - name: Reuse depth data
        uses: actions/cache@v4
        with:
          path: cache
          key: etopo-${{ hashFiles('scripts/build_grid.py') }}
          restore-keys: etopo-
      - name: Get the track-record history
        run: |
          if git ls-remote --exit-code --heads origin history >/dev/null 2>&1; then
            git fetch --depth 1 origin history && git worktree add history FETCH_HEAD
          fi
      - name: Reuse depth saved in the history branch
        run: mkdir -p cache && cp history/depth/*.csv cache/ 2>/dev/null || true
      - name: Build grid
        env:
          STRIKELOG_URL: ${{ secrets.STRIKELOG_URL }}
          STRIKELOG_KEY: ${{ secrets.STRIKELOG_KEY }}
          SOURCE_SITE: ${{ vars.SOURCE_SITE || 'https://andrewcheeky.github.io/jamaica-marine-currents/' }}
        run: python scripts/build_grid.py
      - name: Add the live map
        run: |
          cp web/* site/
          mkdir -p site/vendor/leaflet tmp-leaflet
          (cd tmp-leaflet && npm pack leaflet@1.9.4 --silent && tar xzf leaflet-1.9.4.tgz)
          cp -r tmp-leaflet/package/dist/leaflet.js tmp-leaflet/package/dist/leaflet.css tmp-leaflet/package/dist/images site/vendor/leaflet/
      - name: Smoke test (page loads, no errors)
        run: |
          pip install playwright >/dev/null && python -m playwright install --with-deps chromium >/dev/null
          python scripts/smoke_test.py site
      - name: Save this build's grid to the track record
        run: |
          ts=$(date -u +%Y%m%dT%H%MZ)
          if [ ! -e history/.git ]; then git worktree add --orphan -b history history; fi
          mkdir -p history/grids history/depth && cp site/snapshot.json history/grids/$ts.json
          cp cache/*.csv history/depth/ 2>/dev/null || true
          cd history
          git add grids depth
          git -c user.name="sea-intel-lab bot" -c user.email="noreply@github.com" commit -qm "Grid $ts" || exit 0
          git push -q origin HEAD:history
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
