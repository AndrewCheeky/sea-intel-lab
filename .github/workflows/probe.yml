name: Probe UI
on:
  push:
    branches: [probe-ui]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright pillow >/dev/null && python -m playwright install --with-deps chromium >/dev/null
      - run: |
          mkdir -p site/vendor/leaflet tmp && cp web/* site/ && (cd tmp && npm pack leaflet@1.9.4 --silent && tar xzf leaflet-1.9.4.tgz)
          cp -r tmp/package/dist/leaflet.js tmp/package/dist/leaflet.css tmp/package/dist/images site/vendor/leaflet/
          python scripts/probe_ui.py site
